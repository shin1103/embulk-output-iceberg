name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign the artifacts without publishing them"
        type: boolean
        default: true
      publish_maven_central:
        description: "Publish to Maven Central (turn off to release only the gem)"
        type: boolean
        default: true
      publish_rubygems:
        description: "Push the gem to RubyGems (turn off to release only to Maven Central)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PGP_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PGP_SIGNING_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          project_version="$(./gradlew -q properties --property version | awk '/^version:/ { print $2 }')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in build.gradle ($project_version)." >&2
            exit 1
          fi

      - name: Build and sign
        run: ./gradlew build gem publishAllPublicationsToMavenCentralLocalRepository

      - name: Publish to Maven Central
        if: ${{ !inputs.dry_run && inputs.publish_maven_central != false }}
        env:
          AUTH_TOKEN: ${{ secrets.MAVEN_CENTRAL_AUTH_TOKEN }}
        run: ./gradlew publishToMavenCentralPortal

      # Authenticates through OIDC as a RubyGems trusted publisher, so no API key is
      # stored in the repository and pushing works with MFA enabled on the account.
      - name: Configure RubyGems credentials
        if: ${{ !inputs.dry_run && inputs.publish_rubygems != false }}
        uses: rubygems/configure-rubygems-credentials@main

      - name: Push the gem to RubyGems
        if: ${{ !inputs.dry_run && inputs.publish_rubygems != false }}
        run: ./gradlew gemPush

      - name: Create the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes build/gems/*.gem

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/libs/*.jar
            build/gems/*.gem
